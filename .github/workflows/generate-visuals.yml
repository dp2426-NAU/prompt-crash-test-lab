name: Generate Visuals

on:
  push:
    branches:
      - main

permissions:
  contents: write   # needed to commit generated images back to the repo

jobs:
  generate-visuals:
    runs-on: ubuntu-latest

    steps:
      # ── 1 · Check out the repository ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 2 · Set up Python 3.11 ───────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3 · Install Python dependencies ─────────────────────────────────────
      #       Only the packages run_visuals.py actually uses are installed here.
      #       The full requirements.txt also contains LLM SDKs (openai, anthropic,
      #       sentence-transformers) that pull in gigabytes of model weights and
      #       are not needed for diagram generation.
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            graphviz>=0.20.1 \
            matplotlib>=3.8.0 \
            seaborn>=0.13.0 \
            numpy>=1.26.0 \
            pandas>=2.1.0 \
            kaleido>=0.2.1

      # ── 4 · Install Graphviz system binary ───────────────────────────────────
      - name: Install Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz
          dot -V   # confirm installation

      # ── 5 · Ensure output directory exists ───────────────────────────────────
      - name: Create output directory
        run: mkdir -p outputs/visuals

      # ── 6 · Generate all visual outputs ─────────────────────────────────────
      - name: Run visual generator
        run: python run_visuals.py

      # ── 7 · Commit and push generated images back to the repo ───────────────
      - name: Commit generated images
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add outputs/visuals/

          # Only commit if there are actual changes (avoids empty commits)
          if git diff --staged --quiet; then
            echo "No changes to outputs/visuals/ — skipping commit."
          else
            git commit -m "chore: auto-generate visuals [skip ci]"
            git push
          fi
